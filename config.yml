baseURL: "https://seersees.com/"
languageCode: "zh-cn"
defaultContentLanguage: "zh-cn"
title: "张珈豪ZhangJiahao's ideas"
theme: "PaperMod"
environment: "production"
enableRobotsTXT: true

# ---- 永久链接 ----
# :slug 优先使用 Front Matter 里的 slug 字段（推荐写英文），没有则 fallback 到 :title
permalinks:
  posts: /posts/:slug/

# ---- 自定义输出格式（llms.txt 给 AI 大模型读取站点目录） ----
# Hugo v0.134.0 未内置 LLMS 格式，这里手动注册
outputFormats:
  LLMS:
    mediaType: text/plain
    baseName: llms
    isPlainText: true
    notAlternative: true

# ---- 输出格式 ----
outputs:
  home:
    - HTML
    - RSS
    - JSON
    - LLMS
  section:
    - HTML
    - RSS
  taxonomy:
    - HTML
    - RSS
  term:
    - HTML
    - RSS

# ---- Sitemap ----
sitemap:
  changefreq: weekly
  filename: sitemap.xml
  priority: 0.5

# ---- Markdown 渲染配置 ----
markup:
  goldmark:
    renderer:
      unsafe: true
  tableOfContents:
    startLevel: 2
    endLevel: 4

# ---- 参数 ----
params:
  # 站点简介
  description: "张珈豪的观点ZhangJiahao's ideas"
  keywords: ["预言","predictions","科技","AI","views","金融","财经"]
  author: "张珈豪ZhangJiahao"

  # ---- 站长 HTML 标签验证（比文件验证可靠，绕开 Cloudflare Pages 的 .html 308） ----
  # 百度站长平台 → 重新验证 → 选 HTML 标签验证，把百度给的 codeva-xxx 填进来
  # 注意：Hugo 会把 YAML 键名统一转小写，所以这里全小写
  baiduverificationtag: "codeva-UyjzKJOCpA"
  # googleverificationtag: "google-site-verification-content"
  # bingverificationtag: "Bing 的 msvalidate.01 content"

  # 主 section（首页只列出 posts）
  mainSections:
    - posts

  # ---- PaperMod 功能开关：全部关闭不必要的 JS / 交互 ----
  disableThemeToggle: true      # 关闭深浅色切换按钮及其 JS
  ShowShareButtons: false        # 关闭分享按钮
  ShowPostNavLinks: false        # 关闭上一篇 / 下一篇导航（按需求仅保留返回首页）
  ShowBreadCrumbs: true          # 保留面包屑（SEO 友好）
  ShowCodeCopyButtons: false     # 关闭代码复制按钮（避免额外 JS）
  disableSpecial1stPost: true
  hideAuthor: false

  # ---- 主题切换策略（固定浅色，避免 JS 判断） ----
  defaultTheme: light
  disableScrollBarStyle: true    # 关闭自定义滚动条 CSS

  # ---- OG / Schema.org Publisher ----
  schema:
    publisherType: Person
    sameAs: []

  # ---- 资源指纹（关闭会让 URL 固定，利于缓存与爬虫） ----
  assets:
    disableFingerprinting: false
    theme_color: "#ffffff"
    msapplication_TileColor: "#ffffff"
